<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="navbar">
  <div class="sidebar-backdrop" data-sidebar-close></div>
  <aside class="app-sidebar" id="appSidebar" aria-label="Main navigation">
    <a class="brand-lockup" th:href="@{/dashboard}">
      <span class="brand-symbol">P</span>
      <span class="brand-copy"><strong>PeopleDesk</strong><small>HUMAN RESOURCES</small></span>
    </a>

    <div class="sidebar-section-label">WORKSPACE</div>
    <nav class="sidebar-nav">
      <a class="sidebar-link" th:href="@{/dashboard}" data-nav-link>
        <i class="bi bi-grid-1x2"></i><span>Overview</span>
      </a>
      <a class="sidebar-link" th:href="@{/employees}" sec:authorize="hasAnyRole('SUPER_ADMIN','HR_ADMIN','HR_MANAGER')" data-nav-link>
        <i class="bi bi-people"></i><span>Employees</span>
      </a>
      <a class="sidebar-link" th:href="@{/departments}" sec:authorize="hasAnyRole('SUPER_ADMIN','HR_ADMIN','HR_MANAGER')" data-nav-link>
        <i class="bi bi-diagram-3"></i><span>Departments</span>
      </a>
      <a class="sidebar-link" th:href="@{/attendance}" sec:authorize="hasAnyRole('SUPER_ADMIN','HR_ADMIN','HR_MANAGER')" data-nav-link>
        <i class="bi bi-calendar2-check"></i><span>Attendance</span>
      </a>
      <a class="sidebar-link" th:href="@{/leave-requests}" sec:authorize="hasAnyRole('SUPER_ADMIN','HR_ADMIN','HR_MANAGER')" data-nav-link>
        <i class="bi bi-calendar2-minus"></i><span>Leave management</span>
      </a>
      <a class="sidebar-link" th:href="@{/holidays}" sec:authorize="hasAnyRole('SUPER_ADMIN','HR_ADMIN','HR_MANAGER')" data-nav-link>
        <i class="bi bi-calendar-event"></i><span>Holiday calendar</span>
      </a>
    </nav>

    <div class="sidebar-section-label sidebar-section-spaced">ADMINISTRATION</div>
    <nav class="sidebar-nav">
      <a class="sidebar-link" th:href="@{/admin/registrations}" sec:authorize="hasRole('SUPER_ADMIN')" data-nav-link>
        <i class="bi bi-person-check"></i><span>Registration approvals</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="sidebar-help-card">
        <span class="help-icon"><i class="bi bi-shield-check"></i></span>
        <strong>Your workspace</strong>
        <p>People operations, organized in one place.</p>
      </div>
      <div class="sidebar-version">PEOPLEDESK HRMS <span>•</span> CORE</div>
    </div>
  </aside>

  <header class="app-topbar">
    <div class="topbar-left">
      <button class="icon-button mobile-menu-button" type="button" aria-label="Open navigation" data-sidebar-toggle>
        <i class="bi bi-list"></i>
      </button>
      <div class="topbar-context"><span class="context-eyebrow">PEOPLEDESK WORKSPACE</span><span class="context-title">People operations</span></div>
    </div>
    <div class="topbar-right">
      <label class="topbar-search"><i class="bi bi-search"></i><input type="search" id="pageSearch" placeholder="Search this page" aria-label="Search current page"><kbd>⌕</kbd></label>
      <span class="topbar-divider"></span>
      <div class="user-menu">
        <span class="user-avatar"><i class="bi bi-person-fill"></i></span>
        <span class="user-identity"><strong sec:authentication="name">User</strong><small>Signed in</small></span>
      </div>
      <form th:action="@{/logout}" method="post" class="logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="icon-button logout-button" type="submit" aria-label="Sign out" title="Sign out"><i class="bi bi-box-arrow-right"></i></button>
      </form>
    </div>
  </header>
</div>
</body>
</html>
