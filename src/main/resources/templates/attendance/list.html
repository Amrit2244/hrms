<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Attendance | PeopleDesk HRMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid px-4 py-4"><div class="mb-4"><h1 class="h3 fw-bold">Attendance</h1><p class="text-secondary">Record and review daily employee attendance.</p></div><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><div class="card border-0 shadow-sm mb-4"><div class="card-body"><form method="get" th:action="@{/attendance}" class="row g-2 align-items-end"><div class="col-auto"><label class="form-label">Attendance date</label><input class="form-control" type="date" name="date" th:value="${selectedDate}"></div><div class="col-auto"><button class="btn btn-outline-primary">View date</button></div></form></div></div><div class="card border-0 shadow-sm mb-4"><div class="card-header bg-white fw-semibold">Add attendance record</div><div class="card-body"><form method="post" th:action="@{/attendance}" th:object="${form}" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-3"><label class="form-label">Employee *</label><select class="form-select" th:field="*{employeeId}" required><option value="">Select employee</option><option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.employeeNumber + ' — ' + e.firstName + ' ' + e.lastName}"></option></select><div class="text-danger small" th:errors="*{employeeId}"></div></div><div class="col-md-2"><label class="form-label">Date *</label><input class="form-control" type="date" th:field="*{attendanceDate}" required><div class="text-danger small" th:errors="*{attendanceDate}"></div></div><div class="col-md-2"><label class="form-label">Check in</label><input class="form-control" type="time" th:field="*{checkIn}"></div><div class="col-md-2"><label class="form-label">Check out</label><input class="form-control" type="time" th:field="*{checkOut}"></div><div class="col-md-3"><label class="form-label">Status</label><select class="form-select" th:field="*{status}"><option value="PRESENT">Present</option><option value="ABSENT">Absent</option><option value="HALF_DAY">Half day</option><option value="WORK_FROM_HOME">Work from home</option><option value="ON_LEAVE">On leave</option></select></div><div class="col-md-9"><label class="form-label">Notes</label><input class="form-control" th:field="*{notes}" maxlength="500"></div><div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary w-100">Save attendance</button></div></form></div></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Employee ID</th><th>Employee</th><th>Check in</th><th>Check out</th><th>Status</th><th>Notes</th></tr></thead><tbody><tr th:each="r : ${records}"><td th:text="${r.employee.employeeNumber}"></td><td th:text="${r.employee.firstName + ' ' + r.employee.lastName}"></td><td th:text="${r.checkIn != null ? r.checkIn : '—'}"></td><td th:text="${r.checkOut != null ? r.checkOut : '—'}"></td><td><span class="badge text-bg-secondary" th:text="${r.status}"></span></td><td th:text="${r.notes != null ? r.notes : '—'}"></td></tr><tr th:if="${#lists.isEmpty(records)}"><td colspan="6" class="text-center text-secondary py-4">No attendance records for this date.</td></tr></tbody></table></div></div></main></body></html>
