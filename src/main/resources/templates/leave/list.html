<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Leave management | PeopleDesk HRMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid px-4 py-4"><h1 class="h3 fw-bold">Leave management</h1><p class="text-secondary">Submit leave on behalf of an employee and review pending requests.</p><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><div class="card border-0 shadow-sm mb-4"><div class="card-header bg-white fw-semibold">New leave request</div><div class="card-body"><form method="post" th:action="@{/leave-requests}" th:object="${form}" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-3"><label class="form-label">Employee *</label><select class="form-select" th:field="*{employeeId}" required><option value="">Select employee</option><option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.employeeNumber + ' — ' + e.firstName + ' ' + e.lastName}"></option></select><div class="text-danger small" th:errors="*{employeeId}"></div></div><div class="col-md-2"><label class="form-label">Leave type *</label><select class="form-select" th:field="*{leaveType}"><option value="">Select type</option><option value="CASUAL">Casual</option><option value="SICK">Sick</option><option value="EARNED">Earned</option><option value="UNPAID">Unpaid</option><option value="OTHER">Other</option></select><div class="text-danger small" th:errors="*{leaveType}"></div></div><div class="col-md-2"><label class="form-label">From *</label><input type="date" class="form-control" th:field="*{startDate}"><div class="text-danger small" th:errors="*{startDate}"></div></div><div class="col-md-2"><label class="form-label">To *</label><input type="date" class="form-control" th:field="*{endDate}"><div class="text-danger small" th:errors="*{endDate}"></div></div><div class="col-md-3"><label class="form-label">Reason *</label><input class="form-control" th:field="*{reason}" maxlength="1000"><div class="text-danger small" th:errors="*{reason}"></div></div><div class="col-12"><button class="btn btn-primary">Submit request</button></div></form></div></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Reason</th><th>Status</th><th style="min-width:240px">Review</th></tr></thead><tbody><tr th:each="r : ${requests}"><td><span th:text="${r.employee.firstName + ' ' + r.employee.lastName}"></span><div class="small text-secondary" th:text="${r.employee.employeeNumber}"></div></td><td th:text="${r.leaveType}"></td><td><span th:text="${r.startDate}"></span> – <span th:text="${r.endDate}"></span></td><td th:text="${r.reason}"></td><td><span class="badge text-bg-warning" th:if="${r.status == 'PENDING'}" th:text="${r.status}"></span><span class="badge text-bg-success" th:if="${r.status == 'APPROVED'}" th:text="${r.status}"></span><span class="badge text-bg-danger" th:if="${r.status == 'REJECTED'}" th:text="${r.status}"></span></td><td><form th:if="${r.status == 'PENDING'}" method="post" th:action="@{/leave-requests/{id}/review(id=${r.id})}" class="d-flex gap-1"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input class="form-control form-control-sm" name="comment" placeholder="Optional comment"><button class="btn btn-sm btn-success" name="decision" value="APPROVED">Approve</button><button class="btn btn-sm btn-outline-danger" name="decision" value="REJECTED">Reject</button></form><span class="small text-secondary" th:if="${r.status != 'PENDING'}" th:text="${r.reviewerComment}"></span></td></tr><tr th:if="${#lists.isEmpty(requests)}"><td colspan="6" class="text-center text-secondary py-4">No leave requests yet.</td></tr></tbody></table></div></div></main></body></html>
