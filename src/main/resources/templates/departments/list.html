<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Departments | PeopleDesk HRMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container py-4"><h1 class="h3 fw-bold">Departments</h1><p class="text-secondary">Create and manage company departments.</p><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div class="row g-4"><div class="col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h2 class="h5">Add department</h2><form th:action="@{/departments}" th:object="${form}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label class="form-label">Department name *</label><input class="form-control" th:field="*{name}" required><div class="text-danger small" th:errors="*{name}"></div></div><div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div><button class="btn btn-primary">Save department</button></form></div></div></div><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover mb-0"><thead class="table-light"><tr><th>Department</th><th>Description</th><th>Status</th></tr></thead><tbody><tr th:each="d : ${departments}"><td class="fw-semibold" th:text="${d.name}"></td><td th:text="${d.description != null ? d.description : '—'}"></td><td><span class="badge text-bg-success" th:text="${d.active ? 'Active' : 'Inactive'}"></span></td></tr><tr th:if="${#lists.isEmpty(departments)}"><td colspan="3" class="text-center text-secondary py-4">No departments created.</td></tr></tbody></table></div></div></div></div></main></body></html>
