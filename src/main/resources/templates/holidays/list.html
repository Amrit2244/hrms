<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Company holidays | PeopleDesk HRMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container py-4"><h1 class="h3 fw-bold">Company holidays</h1><p class="text-secondary">Maintain the organization's holiday calendar.</p><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div class="card border-0 shadow-sm mb-4"><div class="card-header bg-white fw-semibold">Add holiday</div><div class="card-body"><form method="post" th:action="@{/holidays}" th:object="${form}" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-3"><label class="form-label">Date *</label><input type="date" class="form-control" th:field="*{holidayDate}"><div class="text-danger small" th:errors="*{holidayDate}"></div></div><div class="col-md-4"><label class="form-label">Holiday name *</label><input class="form-control" th:field="*{name}" maxlength="120"><div class="text-danger small" th:errors="*{name}"></div></div><div class="col-md-5"><label class="form-label">Description</label><input class="form-control" th:field="*{description}" maxlength="500"></div><div class="col-12"><button class="btn btn-primary">Add holiday</button></div></form></div></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Date</th><th>Holiday</th><th>Description</th><th></th></tr></thead><tbody><tr th:each="h : ${holidays}"><td th:text="${h.holidayDate}"></td><td class="fw-semibold" th:text="${h.name}"></td><td th:text="${h.description != null ? h.description : '—'}"></td><td class="text-end"><form method="post" th:action="@{/holidays/{id}/delete(id=${h.id})}" onsubmit="return confirm('Delete this holiday?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(holidays)}"><td colspan="4" class="text-center text-secondary py-4">No holidays added.</td></tr></tbody></table></div></div></main></body></html>
