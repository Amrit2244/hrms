<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employee registration | PeopleDesk HRMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head>
<body class="login-page"><main class="auth-wrap"><div class="card auth-card" style="max-width:650px"><div class="card-body"><div class="auth-brand"><span class="brand-symbol">P</span><span><strong>PeopleDesk</strong><small>HUMAN RESOURCES</small></span></div><h1 class="auth-heading">Employee registration</h1><p class="auth-subheading">Create an account request for your company HRMS.</p>
  <div class="alert alert-info"><i class="bi bi-info-circle me-2"></i>Your account will remain pending until a company administrator reviews and approves it.</div><div th:if="${registrationError}" class="alert alert-danger" th:text="${registrationError}"></div>
  <form th:action="@{/register}" th:object="${form}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3">
    <div class="col-md-6"><label class="form-label" for="firstName">First name *</label><input class="form-control" id="firstName" th:field="*{firstName}" autocomplete="given-name" required maxlength="80"><div class="text-danger small" th:errors="*{firstName}"></div></div>
    <div class="col-md-6"><label class="form-label" for="lastName">Last name *</label><input class="form-control" id="lastName" th:field="*{lastName}" autocomplete="family-name" required maxlength="80"><div class="text-danger small" th:errors="*{lastName}"></div></div>
    <div class="col-12"><label class="form-label" for="email">Email address *</label><input class="form-control" type="email" id="email" th:field="*{email}" autocomplete="email" required maxlength="160"><div class="text-danger small" th:errors="*{email}"></div></div>
    <div class="col-12"><label class="form-label" for="phoneNumber">Phone number</label><input class="form-control" id="phoneNumber" th:field="*{phoneNumber}" autocomplete="tel" maxlength="30"><div class="text-danger small" th:errors="*{phoneNumber}"></div></div>
    <div class="col-12"><label class="form-label" for="username">Username *</label><input class="form-control" id="username" th:field="*{username}" autocomplete="username" required maxlength="40"><div class="form-text">4–40 letters, numbers, dots, underscores or hyphens.</div><div class="text-danger small" th:errors="*{username}"></div></div>
    <div class="col-md-6"><label class="form-label" for="password">Password *</label><input class="form-control" type="password" id="password" th:field="*{password}" autocomplete="new-password" required minlength="12" maxlength="72"><div class="form-text">At least 12 characters.</div><div class="text-danger small" th:errors="*{password}"></div></div>
    <div class="col-md-6"><label class="form-label" for="confirmPassword">Confirm password *</label><input class="form-control" type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password" required><div class="text-danger small" th:errors="*{confirmPassword}"></div></div>
  </div><button class="btn btn-primary w-100 mt-4" type="submit">Submit registration <i class="bi bi-arrow-right ms-1"></i></button></form>
  <p class="text-center mt-4 mb-0" style="font-size:11px;color:#8994a8">Already registered? <a th:href="@{/login}" class="fw-bold">Sign in</a></p>
</div></div></main></body></html>
