<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | PeopleDesk HRMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head>
<body class="login-page"><main class="container"><div class="row min-vh-100 align-items-center justify-content-center"><div class="col-12 col-sm-9 col-md-6 col-lg-4"><div class="card border-0 shadow-lg"><div class="card-body p-4 p-md-5"><div class="text-center mb-4"><div class="brand-mark mx-auto mb-3">P</div><h1 class="h3 fw-bold">PeopleDesk</h1><p class="text-secondary">Sign in to your HR workspace</p></div><div th:if="${param.error}" class="alert alert-danger">Invalid username or password, or your account is disabled.</div><div th:if="${param.logout}" class="alert alert-success">You have signed out.</div><div th:if="${param.registered}" class="alert alert-success">Registration submitted. You can sign in after an administrator approves your account.</div><form th:action="@{/login}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus></div><div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary btn-lg w-100">Sign in</button></form><div class="text-center mt-3"><a th:href="@{/register}">Register as an employee</a></div></div></div><p class="text-center text-secondary small mt-3">Employee accounts require administrator approval.</p></div></div></main></body></html>
