<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employees | PeopleDesk HRMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid px-4 py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 fw-bold">Employees</h1><p class="text-secondary mb-0">Company employee directory</p></div><a class="btn btn-primary" th:href="@{/employees/new}">+ Add employee</a></div><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Employee ID</th><th>Name</th><th>Work email</th><th>Department</th><th>Job title</th><th>Status</th></tr></thead><tbody><tr th:each="e : ${employees.content}"><td class="fw-semibold" th:text="${e.employeeNumber}"></td><td th:text="${e.firstName + ' ' + e.lastName}"></td><td th:text="${e.workEmail}"></td><td th:text="${e.department != null ? e.department.name : '—'}"></td><td th:text="${e.jobTitle != null ? e.jobTitle : '—'}"></td><td><span class="badge text-bg-success" th:text="${e.employmentStatus}"></span></td></tr><tr th:if="${employees.empty}"><td colspan="6" class="text-center text-secondary py-5">No employees yet. Add your first employee.</td></tr></tbody></table></div><div class="card-body d-flex justify-content-between align-items-center" th:if="${employees.totalPages > 1}"><span class="small text-secondary" th:text="|Page ${employees.number + 1} of ${employees.totalPages}|"></span><div class="btn-group"><a class="btn btn-outline-secondary btn-sm" th:if="${employees.hasPrevious()}" th:href="@{/employees(page=${employees.number - 1})}">Previous</a><a class="btn btn-outline-secondary btn-sm" th:if="${employees.hasNext()}" th:href="@{/employees(page=${employees.number + 1})}">Next</a></div></div></div></main></body></html>
