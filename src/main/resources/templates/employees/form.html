<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add employee | PeopleDesk HRMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head>
<body class="app-layout"><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid">
  <div class="breadcrumb-line"><a th:href="@{/employees}">Employees</a><span class="mx-2">/</span><span>Add employee</span></div>
  <div class="page-heading"><div><div class="page-kicker">People management</div><h1 class="page-title">Add employee</h1><p class="page-subtitle">Create a new employee record with their essential work details.</p></div></div>
  <div class="row justify-content-center"><div class="col-12 col-xxl-10"><div class="card"><div class="card-body p-4 p-lg-5">
    <div class="d-flex align-items-center gap-3 mb-4"><span class="metric-icon blue position-static"><i class="bi bi-person-plus"></i></span><div><h2 class="panel-title">Employee information</h2><p class="panel-subtitle">Fields marked with * are required.</p></div></div>
    <form th:action="@{/employees}" th:object="${form}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <h3 class="form-section-title">Basic information</h3>
      <div class="row g-3 mb-4">
        <div class="col-md-6"><label class="form-label">Employee number *</label><input class="form-control" th:field="*{employeeNumber}" placeholder="e.g. EMP-0001" required><div class="text-danger small" th:errors="*{employeeNumber}"></div></div>
        <div class="col-md-6"><label class="form-label">Work email *</label><input class="form-control" type="email" th:field="*{workEmail}" placeholder="name@company.com" required><div class="text-danger small" th:errors="*{workEmail}"></div></div>
        <div class="col-md-6"><label class="form-label">First name *</label><input class="form-control" th:field="*{firstName}" placeholder="Enter first name" required><div class="text-danger small" th:errors="*{firstName}"></div></div>
        <div class="col-md-6"><label class="form-label">Last name *</label><input class="form-control" th:field="*{lastName}" placeholder="Enter last name" required><div class="text-danger small" th:errors="*{lastName}"></div></div>
        <div class="col-md-6"><label class="form-label">Phone number</label><input class="form-control" th:field="*{phoneNumber}" placeholder="Enter phone number"></div>
      </div>
      <h3 class="form-section-title">Employment details</h3>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Job title</label><input class="form-control" th:field="*{jobTitle}" placeholder="e.g. HR Executive"></div>
        <div class="col-md-6"><label class="form-label">Department</label><select class="form-select" th:field="*{departmentId}"><option value="">Select department</option><option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option></select></div>
        <div class="col-md-6"><label class="form-label">Joining date</label><input class="form-control" type="date" th:field="*{joiningDate}"><div class="text-danger small" th:errors="*{joiningDate}"></div></div>
      </div>
      <div class="form-actions"><a class="btn btn-outline-secondary" th:href="@{/employees}">Cancel</a><button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i> Save employee</button></div>
    </form>
  </div></div></div></div>
</main><script th:src="@{/js/app.js}" defer></script></body></html>
