<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add employee | PeopleDesk HRMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container py-4"><div class="mb-4"><a th:href="@{/employees}" class="text-decoration-none">← Employees</a><h1 class="h3 fw-bold mt-2">Add employee</h1><p class="text-secondary">Enter the employee's basic work details.</p></div><div class="card border-0 shadow-sm"><div class="card-body p-4"><form th:action="@{/employees}" th:object="${form}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Employee number *</label><input class="form-control" th:field="*{employeeNumber}" required><div class="text-danger small" th:errors="*{employeeNumber}"></div></div><div class="col-md-6"><label class="form-label">Work email *</label><input class="form-control" type="email" th:field="*{workEmail}" required><div class="text-danger small" th:errors="*{workEmail}"></div></div><div class="col-md-6"><label class="form-label">First name *</label><input class="form-control" th:field="*{firstName}" required><div class="text-danger small" th:errors="*{firstName}"></div></div><div class="col-md-6"><label class="form-label">Last name *</label><input class="form-control" th:field="*{lastName}" required><div class="text-danger small" th:errors="*{lastName}"></div></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" th:field="*{phoneNumber}"></div><div class="col-md-6"><label class="form-label">Job title</label><input class="form-control" th:field="*{jobTitle}"></div><div class="col-md-6"><label class="form-label">Department</label><select class="form-select" th:field="*{departmentId}"><option value="">Select department</option><option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option></select></div><div class="col-md-6"><label class="form-label">Joining date</label><input class="form-control" type="date" th:field="*{joiningDate}"><div class="text-danger small" th:errors="*{joiningDate}"></div></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save employee</button><a class="btn btn-outline-secondary" th:href="@{/employees}">Cancel</a></div></form></div></div></main></body></html>
