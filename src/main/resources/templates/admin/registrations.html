<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration approvals | PeopleDesk HRMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid px-4 py-4">
  <div class="mb-4">
    <h1 class="h3 fw-bold">Employee registration approvals</h1>
    <p class="text-secondary mb-0">Review employee account requests before granting HRMS access.</p>
  </div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>Applicant</th><th>Email</th><th>Username</th><th>Phone</th><th>Submitted</th><th class="text-end">Actions</th></tr></thead>
        <tbody>
        <tr th:each="request : ${requests}">
          <td class="fw-semibold" th:text="${request.firstName + ' ' + request.lastName}"></td>
          <td th:text="${request.email}"></td>
          <td th:text="${request.username}"></td>
          <td th:text="${request.phoneNumber != null ? request.phoneNumber : '—'}"></td>
          <td th:text="${request.createdAt}"></td>
          <td class="text-end">
            <div class="d-inline-flex gap-2">
              <form th:action="@{/admin/registrations/{id}/approve(id=${request.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-success" type="submit">Approve</button>
              </form>
              <form th:action="@{/admin/registrations/{id}/reject(id=${request.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-danger" type="submit">Reject</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(requests)}"><td colspan="6" class="text-center text-secondary py-5">There are no pending registration requests.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
